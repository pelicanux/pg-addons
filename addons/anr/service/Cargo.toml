[package]
name = "anr-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[features]
native-ui = []

[dependencies]
peligames-addon-kit = { path = "../../_infra/sdk", default-features = false, features = ["jobs"] }
peligames-mod-config = { path = "../../_infra/shared/config" }
peligames-archive = { path = "../../_infra/shared/archive", features = ["tar-gz"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
walkdir = "2"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
peligames-addon-kit = { path = "../../_infra/sdk", features = ["runtime"] }
tokio = { version = "1", features = ["rt", "macros"] }
